<text x="54" y="805" font-size="18" fill="#112b43" font-weight="700" text-anchor="start">用连续窗口判断 CP 中的调度空间</text>
<text x="54" y="833" font-size="14" fill="#495f72" font-weight="400" text-anchor="start">严格连续要求四卡同时计算且无 NCCL。无 NCCL 连续允许层内短计算间隙，只统计四卡都在同一层的区间。</text>
<text x="54" y="859" font-size="14" fill="#495f72" font-weight="400" text-anchor="start">独立 AG communicator 的理想并发以 max(AG, RS) 对照。同 communicator 用串行 AG + RS。两者均用末卡进入后的时长。</text>
<text x="54" y="885" font-size="14" fill="#495f72" font-weight="400" text-anchor="start">CP1 的 DP4 FSDP 与 CP4 DDP 是独立实测。保留 4 卡时，CP4 × DP1 的 FSDP dense 分片组仍为 4。</text>
<text x="54" y="910" font-size="13" fill="#495f72" font-weight="400" text-anchor="start">逐 case 图列出严格连续段达到参照时长的样本比例。通过表示时间上有空间，实际并发还取决于就绪与带宽。</text>
</g></svg>
