<text x="56" y="757" font-size="15" fill="#495f72" font-weight="400" text-anchor="start">对同一 microbatch 的相邻反向层，四卡「上层结束 → 本层开始」间隔的偏差中位数仅 1–2 µs。</text>
<text x="56" y="785" font-size="15" fill="#495f72" font-weight="400" text-anchor="start">各轮使用的 causal tile 和数据依赖随 rank、轮次而变。首轮到达差会让早到卡的 SendRecv kernel 区间包含等待。</text>
<text x="56" y="813" font-size="15" fill="#495f72" font-weight="400" text-anchor="start">两套 CP4 × 9 组合都验证了每个 rank、每层前向 4 个 attention kernel / 6 个 SendRecv，反向 12 / 8。</text>
